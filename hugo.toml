baseURL = 'https://tacherasasi.github.io/'
defaultContentLanguage = 'en'
locale = 'en-us'
title = 'Tachera W Sasi — Backend & Infra Engineer (Go, Self-Hosted, Observability)'
enableRobotsTXT = true
enableGitInfo = true
hasCJKLanguage = false
theme = 'hugo-texify3'
paginate = 10
paginatePath = 'page'
enableEmoji = false
pygmentsUseClasses = true

# Canonical + multilingual-safe language setting
[languages.en]
  weight = 1

[markup]
defaultMarkdownHandler = 'goldmark'

[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.extensions.passthrough]
enable = true

[markup.goldmark.extensions.passthrough.delimiters]
block = [['$$', '$$'], ['\\[', '\\]']]
inline = [['$', '$'], ['\\(', '\\)']]

[markup.highlight]
noClasses = false
guessSyntax = true

[markup.tableOfContents]
endLevel = 3
ordered = false
startLevel = 2

# Clean, keyword-bearing URLs for the new project case-study pages.
# Posts keep their historic /posts/ URLs so existing links never break.
[permalinks]
projects = '/projects/:slug/'

# Related content: powers "Keep reading" boxes (tags + categories + keywords)
[related]
threshold = 60
includeNewer = true
toLower = true

[[related.indices]]
name = 'tags'
weight = 80

[[related.indices]]
name = 'categories'
weight = 70

[[related.indices]]
name = 'keywords'
weight = 60

[taxonomies]
tags = 'tags'
categories = 'categories'

# Sitemap tuning: posts change rarely, home changes often
[sitemap]
changefreq = 'weekly'
filename = 'sitemap.xml'
priority = 0.5

# RSS: full content helps readers, summary helps SEO reuse
[outputs]
home = ['HTML', 'RSS']
section = ['HTML', 'RSS']
page = ['HTML']
taxonomy = ['HTML', 'RSS']
term = ['HTML', 'RSS']

[[menu.main]]
identifier = 'home'
name = 'Home'
url = '/'
weight = 1

[[menu.main]]
identifier = 'about'
name = 'About'
url = '/about/'
weight = 2

[[menu.main]]
identifier = 'posts'
name = 'Writings'
url = '/posts/'
weight = 3

[[menu.main]]
identifier = 'projects'
name = 'Projects'
url = '/projects/'
weight = 4

[[menu.main]]
identifier = 'music'
name = 'Music'
url = '/music/'
weight = 5

[[menu.main]]
identifier = 'philosophy'
name = 'Philosophy'
url = '/philosophy/'
weight = 6

[[menu.main]]
identifier = 'contact'
name = 'Contact'
url = '/contact/'
weight = 7

[params]
title = 'Tachera W Sasi'
author = 'Tachera W Sasi'
authorBio = 'Tachera W Sasi is a backend and infrastructure engineer building boring, reliable, self-hosted production infrastructure in Go: ekilie.cloud (VPS hosting & managed deployments) and BeamDrop (self-hosted file sharing with S3-compatible API). Creator of VintLang.'
authorJobTitle = 'Backend & Infrastructure Engineer'
description = 'Portfolio, projects and engineering writing by Tachera W Sasi — backend & infra engineer building boring, reliable, self-hosted, observable production infrastructure in Go (ekilie.cloud, BeamDrop, VintLang).'
keywords = ['tachera sasi', 'tachera w sasi', 'golang backend engineer', 'go infrastructure', 'self-hosted', 'observability', 'ekilie cloud', 'beamdrop', 'vintlang', 'software engineer portfolio', 'open source go']
siteType = 'Person'
locale = 'en_US'
# Fallback social image (absolute URL built at render time). Must exist in static/.
